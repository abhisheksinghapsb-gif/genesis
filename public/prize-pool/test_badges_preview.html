<!DOCTYPE html>
<html>
<head>
<style>
body { background: #0b1a48; color: white; font-family: sans-serif; padding: 30px; text-align: center; }
.row { display: flex; justify-content: center; gap: 20px; margin-bottom: 40px; }
.badge-card { background: #09348c; padding: 15px; border-radius: 12px; border: 2px solid #20ceff; }
.badge-card img { height: 260px; transition: transform 0.2s; }
.badge-card img:hover { transform: scale(1.05) translateY(-6px); }
</style>
</head>
<body>
<h1>Standalone Badges Quality Test</h1>
<h2>Main Tournament Arena Badges (Prizes)</h2>
<div class="row">
  <div class="badge-card"><h3>1st - ₹17,500</h3><img src="badge_main_1st.svg"></div>
  <div class="badge-card"><h3>2nd - ₹15,000</h3><img src="badge_main_2nd.svg"></div>
  <div class="badge-card"><h3>3rd - ₹12,500</h3><img src="badge_main_3rd.svg"></div>
</div>
<h2>VR Track Arena Badges</h2>
<div class="row">
  <div class="badge-card"><h3>1st - ₹10,000</h3><img src="badge_vr_1st.svg"></div>
  <div class="badge-card"><h3>2nd - ₹5,000</h3><img src="badge_vr_2nd.svg"></div>
</div>
</body>
</html>
